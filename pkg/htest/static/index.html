<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接口压力测试平台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1:before {
            content: "🚀";
            font-size: 32px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: calc(100vh - 150px);
        }

        .sidebar {
            background: #f8fafc;
            padding: 25px;
            border-right: 1px solid #e2e8f0;
        }

        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .control-panel h2 {
            color: #1e293b;
            margin-bottom: 20px;
            font-size: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .api-list {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .api-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .api-item h4 {
            color: #1e293b;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .api-item p {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 25px;
        }

        .button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .button.start {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            grid-column: span 2;
        }

        .button.stop {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            grid-column: span 2;
        }

        .button.reset {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            grid-column: span 2;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .content-area {
            padding: 25px;
            overflow-y: auto;
            max-height: calc(100vh - 150px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            border-top: 4px solid;
        }

        .stat-card.success {
            border-color: #10b981;
        }

        .stat-card.failure {
            border-color: #ef4444;
        }

        .stat-card.tps {
            border-color: #3b82f6;
        }

        .stat-card.latency {
            border-color: #8b5cf6;
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card.success .value {
            color: #10b981;
        }

        .stat-card.failure .value {
            color: #ef4444;
        }

        .stat-card.tps .value {
            color: #3b82f6;
        }

        .stat-card.latency .value {
            color: #8b5cf6;
        }

        .stat-card .subtitle {
            color: #94a3b8;
            font-size: 12px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 25px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            height: 300px;
            position: relative;
        }

        .chart-container h3 {
            color: #1e293b;
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-container h3:before {
            content: "📈";
            font-size: 18px;
        }

        .detailed-stats {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .detailed-stats h3 {
            color: #1e293b;
            margin-bottom: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detailed-stats h3:before {
            content: "📊";
            font-size: 20px;
        }

        .api-stats-table {
            width: 100%;
            border-collapse: collapse;
        }

        .api-stats-table th {
            background: #f8fafc;
            padding: 12px 15px;
            text-align: left;
            color: #475569;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 2px solid #e2e8f0;
        }

        .api-stats-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
            font-size: 13px;
        }

        .api-stats-table tr:hover {
            background: #f8fafc;
        }

        .api-stats-table .success-rate {
            color: #10b981;
            font-weight: 600;
        }

        .api-stats-table .latency {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
        }

        .log-container {
            background: #1e293b;
            color: #e2e8f0;
            padding: 25px;
            border-radius: 12px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
        }

        .log-container h3 {
            color: #94a3b8;
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .log-container h3:before {
            content: "📝";
            font-size: 18px;
        }

        .log-entry {
            margin-bottom: 8px;
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry.success {
            color: #10b981;
        }

        .log-entry.error {
            color: #ef4444;
        }

        .log-entry.info {
            color: #3b82f6;
        }

        .timestamp {
            color: #94a3b8;
            margin-right: 10px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .tab {
            padding: 12px 20px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        .tab.active {
            color: #667eea;
        }

        .tab.active:after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .chart-container h3 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-container .last-update {
            font-size: 12px;
            color: #64748b;
            font-weight: normal;
        }

        #distribution-chart-container {
            position: relative;
        }

        #distribution-summary {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        #distribution-summary .total {
            font-size: 24px;
            font-weight: bold;
            color: #1e293b;
        }

        #distribution-summary .label {
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>接口压力测试监控平台</h1>
        <p>实时监控与详细统计 | 多接口混合压测</p>
    </div>

    <div class="main-content">
        <!-- 左侧配置栏 -->
        <div class="sidebar">
            <div class="control-panel">
                <h2>📋 压测配置</h2>
                <div class="form-group">
                    <label>压测时长</label>
                    <select id="duration">
                        <option value="30s">30秒</option>
                        <option value="1m">1分钟</option>
                        <option value="5m" selected>5分钟</option>
                        <option value="10m">10分钟</option>
                        <option value="30m">30分钟</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>并发数</label>
                    <input type="number" id="concurrency" value="50" min="1" max="1000">
                </div>

                <div class="form-group">
                    <label>QPS限制</label>
                    <input type="number" id="rateLimit" value="200" min="1" max="10000">
                </div>

                <div class="control-buttons">
                    <button class="button start" id="start-test">
                        <span>▶️</span> 开始压测
                    </button>
                    <button class="button stop" id="stop-test" disabled>
                        <span>⏹️</span> 停止
                    </button>
                    <button class="button reset" id="reset-stats">
                        <span>🔄</span> 重置统计
                    </button>
                </div>
            </div>

            <div class="api-list" id="api-list">
                <h3>🎯 API列表 (固定接口)</h3>

            </div>
        </div>

        <!-- 右侧内容区域 -->
        <div class="content-area">
            <!-- 统计数据 -->
            <div class="stats-grid">
                <div class="stat-card success">
                    <h3>成功请求</h3>
                    <div class="value" id="success-count">0</div>
                    <div class="subtitle">总成功率: <span id="success-rate">0%</span></div>
                </div>
                <div class="stat-card failure">
                    <h3>失败请求</h3>
                    <div class="value" id="failure-count">0</div>
                    <div class="subtitle">失败率: <span id="failure-rate">0%</span></div>
                </div>
                <div class="stat-card tps">
                    <h3>当前TPS</h3>
                    <div class="value" id="tps">0.00</div>
                    <div class="subtitle">请求总数: <span id="total-requests">0</span></div>
                </div>
                <div class="stat-card latency">
                    <h3>平均延迟</h3>
                    <div class="value" id="avg-latency">0ms</div>
                    <div class="subtitle">最小: <span id="min-latency">0ms</span> / 最大: <span
                            id="max-latency">0ms</span></div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-container">
                    <h3>TPS趋势图</h3>
                    <canvas id="tps-chart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>API调用分布</h3>
                    <canvas id="distribution-chart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>接口耗时趋势</h3>
                    <canvas id="latency-chart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>成功率趋势</h3>
                    <canvas id="success-chart"></canvas>
                </div>
            </div>

            <!-- 详细统计表格 -->
            <div class="detailed-stats">
                <h3>📊 接口详细统计</h3>
                <div class="table-container">
                    <table class="api-stats-table">
                        <thead>
                        <tr>
                            <th>API名称</th>
                            <th>请求次数</th>
                            <th>成功次数</th>
                            <th>失败次数</th>
                            <th>成功率</th>
                            <th>最小耗时</th>
                            <th>最大耗时</th>
                            <th>平均耗时</th>
                            <th>当前TPS</th>
                        </tr>
                        </thead>
                        <tbody id="api-stats-body">
                        <!-- 数据将通过JS动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 日志区域 -->
            <div class="log-container">
                <h3>实时日志</h3>
                <div id="log-content">
                    <div class="log-entry info">
                        <span class="timestamp">[系统]</span> 等待开始压测...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
