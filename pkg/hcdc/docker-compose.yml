services:
  doris:
    image: apache/doris:all-in-one-4.1.3
    container_name: doris-dev
    hostname: doris-dev
    ports:
      - "9030:9030"   # MySQL 连接端口（最重要）
      - "8030:8030"   # FE Web UI
      - "8040:8040"   # BE HTTP 端口（可选）
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 挂载数据目录到本地，方便查看和备份
      - ./data:/opt/apache-doris/fe/doris-meta
      - ./logs:/opt/apache-doris/log
      # 挂载初始化脚本目录（可选）
      - ./init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-P9030", "-h127.0.0.1", "-e", "select 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
