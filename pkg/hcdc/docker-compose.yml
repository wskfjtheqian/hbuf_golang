services:
  doris-all:
    image: apache/doris:3.0.8-all
    # 💡 关键 1：在 Windows 上必须通过 ports 显式映射，不能使用 network_mode: "host"
    ports:
      - "9030:9030" # MySQL 协议连接端口 (FE) -> 你的 Go 引擎 JDBC 指向这里
      - "8030:8030" # Web UI 端口 (FE)
      - "8040:8040" # Stream Load 异步 Http 端口 (BE) -> 你的 Go 引擎上传指向这里
    environment:
      - TZ=UTC                  # 💡 保持 0时区 (UTC)
      - FE_SERVERS=fe1:127.0.0.1:9010
      - BE_SERVERS=be1:127.0.0.1:9050
      # 💡 关键：Doris BE 的 start_be.sh 默认会检查 swap（swapon -s）并在宿主机开启 swap 时拒绝启动。
      #    但容器内 /proc/swaps 反映的是宿主机，无法也不应在容器里关闭宿主机 swap。
      #    设 SKIP_CHECK_ULIMIT=true 可跳过该检查块（含 swap/max_map_count 检查），
      #    从而既不用 swapoff 关宿主机 swap，也不需要 privileged 特权模式。
      - SKIP_CHECK_ULIMIT=true
    volumes:
      # 💡 关键 2：Windows 下挂载目录建议使用相对路径，Docker Desktop 会自动处理权限
      - ./doris/fe_meta:/opt/apache-doris/fe/doris-meta
      - ./doris/be_storage:/opt/apache-doris/be/storage
      - ./doris/logs:/opt/apache-doris/log
    # 💡 覆盖镜像 ENTRYPOINT（原为 ["bash","entry_point.sh"]），在启动前先调低 FE 的 JVM 堆内存。
    #    镜像默认 fe.conf 里 -Xmx8192m / -Xms8192m 会让 FE 一启动就预留 8G 堆，
    #    与 BE 共抢 12G 容器限额导致 OOM。这里用 sed 降到 2G，从而无需再挂载 doris_fe.conf。
    entrypoint: >-
      bash -c "
        sed -i 's/-Xmx8192m/-Xmx2048m/g; s/-Xms8192m/-Xms2048m/g' /opt/apache-doris/fe/conf/fe.conf &&
        sed -i '/^[[:space:]]*enable_stream_load_record[[:space:]]*=/d' /opt/apache-doris/be/conf/be.conf &&
        echo 'enable_stream_load_record = true' >> /opt/apache-doris/be/conf/be.conf &&
        sed -i '/^[[:space:]]*fetch_stream_load_record_interval_second[[:space:]]*=/d' /opt/apache-doris/fe/conf/fe.conf &&
        echo 'fetch_stream_load_record_interval_second = 5' >> /opt/apache-doris/fe/conf/fe.conf &&
        exec bash /usr/local/bin/entry_point.sh
      "
    # 💡 关键：不要用 privileged: true。特权容器内执行的 swapoff/sysctl 等命令会直接作用于宿主机，
    #    这是之前"启动 Doris 关掉了宿主机 swap"的根因。Doris 的 entry_point 脚本并不需要特权模式。
    # 💡 2. 修复 mem_limit 的缩进位置（移入 deploy 块中）
    deploy:
      resources:
        limits:
          memory: 12g
    # 💡 BE 要求 max open file descriptors >= 60000，否则 start_be.sh 直接退出
    ulimits:
      nofile:
        soft: 655350
        hard: 655350
    networks:
      default:
        ipv4_address: ${CDC_DORIS_CONTAINER_IP:-172.19.0.2}

# 💡 所有服务使用静态 IP，避免容器重建后 IP 漂移。
networks:
  default:
    ipam:
      config:
        - subnet: ${CDC_DORIS_SUBNET:-172.19.0.0/16}
