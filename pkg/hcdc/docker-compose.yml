services:
  doris-all:
    image: apache/doris:3.0.8-all
    container_name: doris-all
    # 💡 关键 1：在 Windows 上必须通过 ports 显式映射，不能使用 network_mode: "host"
    ports:
      - "9030:9030" # MySQL 协议连接端口 (FE) -> 你的 Go 引擎 JDBC 指向这里
      - "8030:8030" # Web UI 端口 (FE)
      - "8040:8040" # Stream Load 异步 Http 端口 (BE) -> 你的 Go 引擎上传指向这里
    environment:
      - TZ=UTC                  # 💡 保持 0时区 (UTC)
      - FE_SERVERS=fe1:127.0.0.1:9010
      - BE_SERVERS=be1:127.0.0.1:9050
    volumes:
      # 💡 关键 2：Windows 下挂载目录建议使用相对路径，Docker Desktop 会自动处理权限
      - ./doris/fe_meta:/opt/apache-doris/fe/doris-meta
      - ./doris/be_storage:/opt/apache-doris/be/storage
      - ./doris/logs:/opt/apache-doris/log
      - ./doris_fe.conf:/opt/apache-doris/fe/conf/fe.conf
    command: sh -c " swapoff -a 2>/dev/null || true && /usr/local/bin/entry_point.sh"
    privileged: true
